version: "3.7"
services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:nightly
    container_name: mealie
    ports:
      - "1005:9000"
    deploy:
      resources:
        limits:
          memory: 1000M # 


    volumes:
      - mealie-data:/app/data/
    environment:
    # Set Backend ENV Variables Here
      - ALLOW_SIGNUP=true
      - PUID=1000
      - PGID=1000
      - TZ=America/Anchorage
      - MAX_WORKERS=1
      - WEB_CONCURRENCY=1
    restart: always
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.http.routers.mealie.entrypoints=websecure
      - traefik.http.routers.mealie.tls.certresolver=myresolver
      - traefik.http.routers.mealie.rule=Host(`mealie.hj320mcserver.xyz`)

volumes:
  mealie-data:
    driver: local

networks:
  web:
    name: web
    external: true
