- resources:
    cpu: true
    memory: true
    cputemp: true
    units: metric
    uptime: true
    refresh: 30000
      # label: Storage
      # disk: /home/henry/
      # - search:
      # provider: duckduckgo
      # target: _blank

# - greeting:
      # text_size: xl
      # text: Welcome back, Henry!

- search:
    provider: duckduckgo
    focus: true
    target: _blank

- datetime:
    locale: en
    format:
        dateStyle: long
        timeStyle: short
