version: '3.3'
services:
    speedtest-tracker:
        container_name: speedtest-tracker
        ports:
            - '1009:80'
            - '1010:443'
        environment:
            - PUID=1000
            - PGID=1000
            - DB_CONNECTION=mysql
            - DB_HOST=db
            - DB_PORT=3306
            - DB_DATABASE=speedtest_tracker
            - DB_USERNAME=henry
            - DB_PASSWORD=ekVPKZHgNRjY5vqfpw
            - TZ=Europe/London
        volumes:
            - '/etc/localtime:/etc/localtime:ro'
            - '/home/henry/Software/SpeedtestTracker/config:/config'
            - '/home/henry/Software/SpeedtestTracker/web:/etc/ssl/web'
        image: 'ghcr.io/alexjustesen/speedtest-tracker:latest'
        restart: unless-stopped
        depends_on:
            - db
        networks:
            - web
        labels:
            - traefik.enable=true
            - traefik.http.routers.speedtest-tracker.entrypoints=websecure
            - traefik.http.routers.speedtest-tracker.tls.certresolver=myresolver
            - traefik.http.routers.speedtest-tracker.rule=Host(`speedtest.hj320mcserver.xyz`)
    db:
        image: mariadb:10
        restart: always
        environment:
            - MARIADB_DATABASE=speedtest_tracker
            - MARIADB_USER=henry
            - MARIADB_PASSWORD=NGINX_PASSWORD
            - MARIADB_RANDOM_ROOT_PASSWORD=true
        volumes:
            - speedtest-db:/var/lib/mysql
        networks:
            - web
volumes:
  speedtest-db:

networks:
  web:
    name: web
    external: true
